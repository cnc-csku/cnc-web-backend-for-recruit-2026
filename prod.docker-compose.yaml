version: "3.9"

services:
  cnc-recruite-backend-api:
    build: .
    container_name: cnc-recruite-backend-api
    ports:
      - "${ELYSIA_PORT}:${ELYSIA_PORT}"
    env_file:
      - .env.prod
    depends_on:
      - mongo
      - minio

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.prod
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'Waiting for MinIO...' && sleep 2; done;
      /usr/bin/mc mb minio/$$MINIO_BUCKET_NAME --ignore-existing;
      /usr/bin/mc anonymous set download minio/$$MINIO_BUCKET_NAME;
      echo 'MinIO initialization complete';
      "
    restart: "no"

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - ./mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["bash", "/scripts/mongo-init.sh"]
    restart: "no"

volumes:
  mongo-data:
  minio-data:
